server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Resolve backend:8080 per request (Docker DNS), so nginx starts and survives backend restarts.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:8080;

    location /api/ {
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;   # log fetches over SSH can take a while
    }

    # MCP Streamable HTTP (SSE): no buffering, long-lived responses.
    location /mcp {
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # Hashed assets never change.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback; index.html is never cached so new deploys are picked up.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
